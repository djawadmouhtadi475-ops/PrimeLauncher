[package]
name = "prime-launcher"
version = "0.3.5"
description = "أول لانشر عربي | The First Arabic Minecraft Launcher"
authors = ["djawad1", "egyptia26"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["api-all", "os-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
